# Vigiles global settings (docs/poc-spec.md §14). Re-read before every job.

data_dir: ~/.vigiles # DB, OSV databases, code snapshots. Override with VIGILES_DATA_DIR.

bin:
  claude: claude
  osv_scanner: osv-scanner
  git: git

osv:
  ecosystems: [] # extra ecosystems to keep fresh; the ones found in lockfiles are always synced

triage:
  active_config: v3-opus-high-code # drives decisions; exactly one
  min_priority: P3 # triage everything: the P3 sweep (2026-11-11) found serious findings that CVSS had rated low; priority only orders the queue
  max_per_run: 25 # cap per triage job (protects subscription usage)
  concurrency: 3
  timeout_minutes: 10
  max_budget_usd_per_run: 3 # passed to claude --max-budget-usd (list-price equivalent)
  configs:
    - name: v3-opus-high-code # prompt v3 = v2 + the owner's own precedents, stricter "latent", trigger verification (2026-11-11)
      prompt_version: v3
      model: opus
      effort: high
      code_access: true
    - name: v3-sonnet-high-code
      prompt_version: v3
      model: sonnet
      effort: high
      code_access: true
    - name: v2-opus-high-code # prompt v2 = v1 + the owner's ping/digest/log rubric (2026-11-11)
      prompt_version: v2
      model: opus
      effort: high
      code_access: true
    - name: v2-sonnet-high-code
      prompt_version: v2
      model: sonnet
      effort: high
      code_access: true
    - name: v1-opus-high-code
      prompt_version: v1
      model: opus
      effort: high
      code_access: true
    - name: v1-opus-high-nocode # experiment: does triage need the source? (spec §11.3)
      prompt_version: v1
      model: opus
      effort: high
      code_access: false
    - name: v1-sonnet-high-code # experiment: cheaper model
      prompt_version: v1
      model: sonnet
      effort: high
      code_access: true
    - name: v1-sonnet-high-nocode # cheap pilot of the code-access experiment
      prompt_version: v1
      model: sonnet
      effort: high
      code_access: false
    - name: v1-haiku-high-code
      prompt_version: v1
      model: haiku
      effort: high
      code_access: true

staleness:
  osv_max_age_hours: 24
  refresh_max_age_days: 7
